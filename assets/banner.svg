<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">

    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#07111F"/>
        <stop offset="55%" stop-color="#0B1220"/>
        <stop offset="100%" stop-color="#10233A"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#2EA8FF"/>
        <stop offset="100%" stop-color="#4CC2FF"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <style>
        .title { font: 700 56px 'Inter', Arial, sans-serif; fill: #FFFFFF; }
        .subtitle { font: 500 25px 'Inter', Arial, sans-serif; fill: #D9E7F5; }
        .small { font: 600 18px 'Inter', Arial, sans-serif; fill: #A9C2D9; letter-spacing: 1px; }
        .label { font: 700 20px 'Inter', Arial, sans-serif; fill: #FFFFFF; }
      </style>
    </defs>
    
<rect width="1600" height="500" fill="url(#bg)"/>
<!-- subtle grid -->
<g opacity="0.13" stroke="#2EA8FF">
  <line x1="0" y1="0" x2="0" y2="500"/><line x1="80" y1="0" x2="80" y2="500"/><line x1="160" y1="0" x2="160" y2="500"/><line x1="240" y1="0" x2="240" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="480" y1="0" x2="480" y2="500"/><line x1="560" y1="0" x2="560" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/><line x1="720" y1="0" x2="720" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/><line x1="880" y1="0" x2="880" y2="500"/><line x1="960" y1="0" x2="960" y2="500"/><line x1="1040" y1="0" x2="1040" y2="500"/><line x1="1120" y1="0" x2="1120" y2="500"/><line x1="1200" y1="0" x2="1200" y2="500"/><line x1="1280" y1="0" x2="1280" y2="500"/><line x1="1360" y1="0" x2="1360" y2="500"/><line x1="1440" y1="0" x2="1440" y2="500"/><line x1="1520" y1="0" x2="1520" y2="500"/><line x1="1600" y1="0" x2="1600" y2="500"/>
  <line x1="0" y1="0" x2="1600" y2="0"/><line x1="0" y1="80" x2="1600" y2="80"/><line x1="0" y1="160" x2="1600" y2="160"/><line x1="0" y1="240" x2="1600" y2="240"/><line x1="0" y1="320" x2="1600" y2="320"/><line x1="0" y1="400" x2="1600" y2="400"/><line x1="0" y1="480" x2="1600" y2="480"/>
</g>
<!-- left content -->
<text x="92" y="145" class="small">FELIX BRILLANT</text>
<text x="92" y="220" class="title">AI and Data Engineer</text>
<text x="92" y="272" class="subtitle">Engineering AI platforms that transform enterprise data</text>
<text x="92" y="310" class="subtitle">into trusted operational decisions.</text>
<rect x="92" y="352" width="640" height="2" fill="url(#accent)"/>
<text x="92" y="395" class="small">CLOUD ARCHITECTURE  •  DECISION INTELLIGENCE  •  DATA ENGINEERING</text>

<!-- right-side system illustration -->
<g transform="translate(1035,72)">
  <path d="M55 175 C130 95, 255 95, 330 175" fill="none" stroke="#2EA8FF" stroke-width="3" opacity="0.65"/>
  <path d="M55 175 C130 255, 255 255, 330 175" fill="none" stroke="#4CC2FF" stroke-width="3" opacity="0.45"/>
  <circle cx="55" cy="175" r="34" fill="#0E2136" stroke="#2EA8FF" stroke-width="2"/>
  <circle cx="330" cy="175" r="34" fill="#0E2136" stroke="#4CC2FF" stroke-width="2"/>
  <circle cx="192" cy="175" r="56" fill="#102A44" stroke="#4CC2FF" stroke-width="3" filter="url(#glow)"/>
  <text x="192" y="168" text-anchor="middle" class="label">TRUSTED</text>
  <text x="192" y="194" text-anchor="middle" class="label">DECISIONS</text>
  <text x="55" y="180" text-anchor="middle" class="small" style="font-size:15px">DATA</text>
  <text x="330" y="180" text-anchor="middle" class="small" style="font-size:15px">AI</text>
  <circle cx="110" cy="105" r="8" fill="#2EA8FF"/>
  <circle cx="274" cy="105" r="8" fill="#4CC2FF"/>
  <circle cx="110" cy="245" r="8" fill="#4CC2FF"/>
  <circle cx="274" cy="245" r="8" fill="#2EA8FF"/>
  <path d="M113 108 L165 148 M271 108 L219 148 M113 242 L165 202 M271 242 L219 202" stroke="#A9C2D9" stroke-width="2" opacity="0.7"/>
</g>
</svg>